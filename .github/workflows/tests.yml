name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Set NIK hash key (test-only secret, not used outside CI)
        run: echo "NIK_HASH_KEY=$(php -r 'echo bin2hex(random_bytes(32));')" >> .env

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Run test suite
        run: php artisan test
