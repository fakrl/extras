<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIM Casting JBTB — Master UI/UX Prototype & Design System (All 5 Roles)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    /* ==========================================================================
       1. OFFICIAL DESIGN TOKENS (UI-GUIDELINES.md — theme-style.blade.php)
       ========================================================================== */
    :root {
      /* Typography Scale (AY.3.1) */
      --fs-xs: 12px;     /* Floor: badge, small label, metric-label */
      --fs-sm: 13px;     /* Secondary text, .btn-sm (desktop only) */
      --fs-base: 14px;   /* Default body, .btn, .alert-* */
      --fs-md: 16px;     /* Inputs/selects (anti iOS auto-zoom), card subtitle */
      --fs-lg: 18px;     /* Section / card heading */
      --fs-xl: 22px;     /* Metric value, main page title */

      /* Border Radius Scale */
      --radius-sm: 6px;  /* .badge */
      --radius-md: 8px;  /* .btn, input, .alert-* */
      --radius-lg: 12px; /* .card, .metric-card */

      /* Spacing Scale (4px step) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;

      /* Light Theme Palette (Opsi B — WCAG AA Verified) */
      --bg-page: #eef2ea;
      --bg-card: #ffffff;
      --bg-card-subtle: #f7f9f5;
      --bg-card-hover: #f1f5ee;
      --text-primary: #111c15;
      --text-secondary: #334238;
      --text-muted: #536358;
      --border-color: #d5dfd7;
      --border-strong: #b4c5b8;

      /* Brand & Semantic Tokens */
      --accent: #15803d;
      --accent-strong: #0b5e2c;
      --accent-on: #ffffff;
      --info: #1d4ed8;
      --warning: #92400e;
      --danger: #b91c1c;
      --urgent: #c2410c;
      --urgent-on: #ffffff;

      /* Badge Tints (Light) */
      --badge-aktif-bg: rgba(21, 128, 61, 0.10);
      --badge-aktif-border: rgba(11, 94, 44, 0.28);
      --badge-aktif-text: #0b5e2c;

      --badge-pending-bg: rgba(217, 119, 6, 0.12);
      --badge-pending-border: rgba(146, 64, 14, 0.30);
      --badge-pending-text: #92400e;

      --badge-tolak-bg: rgba(185, 28, 28, 0.10);
      --badge-tolak-border: rgba(185, 28, 28, 0.28);
      --badge-tolak-text: #b91c1c;

      --badge-info-bg: rgba(29, 78, 216, 0.10);
      --badge-info-border: rgba(29, 78, 216, 0.26);
      --badge-info-text: #1d4ed8;

      --badge-netral-bg: rgba(67, 84, 73, 0.10);
      --badge-netral-border: rgba(67, 84, 73, 0.24);
      --badge-netral-text: #435449;

      /* Layout Dimensions */
      --sidebar-width: 240px;
      --sidebar-collapsed-width: 68px;
      --topbar-height: 60px;
      --shadow-sm: 0 1px 3px rgba(17, 28, 21, 0.05);
      --shadow-md: 0 6px 18px rgba(17, 28, 21, 0.08);
    }

    html[data-theme="dark"] {
      --bg-page: #0b1310;
      --bg-card: #151d19;
      --bg-card-subtle: #1b2520;
      --bg-card-hover: #212e27;
      --text-primary: #ecf3ee;
      --text-secondary: #b9cabe;
      --text-muted: #8ea395;
      --border-color: #26352d;
      --border-strong: #374c40;

      --accent: #0f9a4c;
      --accent-strong: #22b862;
      --accent-on: #04140a;
      --info: #60a5fa;
      --warning: #f59e0b;
      --danger: #fa7a7f;
      --urgent: #fb923c;
      --urgent-on: #1a0f05;

      --badge-aktif-bg: rgba(34, 184, 98, 0.14);
      --badge-aktif-border: rgba(34, 184, 98, 0.35);
      --badge-aktif-text: #22b862;

      --badge-pending-bg: rgba(245, 158, 11, 0.14);
      --badge-pending-border: rgba(245, 158, 11, 0.35);
      --badge-pending-text: #f59e0b;

      --badge-tolak-bg: rgba(250, 122, 127, 0.14);
      --badge-tolak-border: rgba(250, 122, 127, 0.35);
      --badge-tolak-text: #fa7a7f;

      --badge-info-bg: rgba(96, 165, 250, 0.14);
      --badge-info-border: rgba(96, 165, 250, 0.35);
      --badge-info-text: #60a5fa;

      --badge-netral-bg: rgba(157, 179, 162, 0.12);
      --badge-netral-border: rgba(157, 179, 162, 0.28);
      --badge-netral-text: #9db3a2;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* ==========================================================================
       2. BASE & ACCESSIBILITY ("SEMUA UMUR" RNF-05)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--fs-base);
      line-height: 1.5;
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 2px;
    }

    /* ==========================================================================
       3. PROTOTYPE CONTROL BAR (FOR DESIGNER / AI EXPORT & ROLE SWITCHING)
       ========================================================================== */
    .proto-toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0b1a12;
      color: #ecf3ee;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #26352d;
      font-size: var(--fs-sm);
    }

    .proto-toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .proto-label {
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8ea395;
      font-weight: 600;
      margin-right: 4px;
    }

    .proto-pill {
      min-height: 34px;
      padding: 4px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid #2d4237;
      background: #14241b;
      color: #cfe0d4;
      font-size: var(--fs-xs);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .proto-pill:hover {
      background: #1e3528;
      color: #ffffff;
    }

    .proto-pill.active {
      background: #22b862;
      color: #04140a;
      border-color: #22b862;
    }

    /* Viewport simulator wrapper */
    .viewport-stage {
      transition: max-width 0.25s ease, margin 0.25s ease;
      min-height: calc(100vh - 51px);
    }

    .viewport-stage.sim-mobile {
      max-width: 390px;
      margin: 20px auto;
      border: 8px solid #1f2923;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      min-height: 844px;
      position: relative;
      background: var(--bg-page);
    }

    /* ==========================================================================
       4. APP SHELL (FIXED SIDEBAR + TOPBAR — FIXING THE 1-CHAR WRAP BUG!)
       ========================================================================== */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: calc(100vh - 51px);
      transition: grid-template-columns 0.2s ease;
    }

    .app-shell.sidebar-collapsed {
      grid-template-columns: var(--sidebar-collapsed-width) minmax(0, 1fr);
    }

    /* Sidebar Fixes:
       1. white-space: nowrap prevents "D-a-s-h-b-o-a-r-d" vertical character stack
       2. When collapsed, .nav-label and .nav-section-title hide cleanly
    */
    .app-sidebar {
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 51px;
      height: calc(100vh - 51px);
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 30;
    }

    .sidebar-header {
      height: var(--topbar-height);
      padding: 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      gap: var(--space-2);
      flex-shrink: 0;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-on);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sidebar-nav {
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .nav-section-title {
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 12px 10px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item {
      min-height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: var(--fs-base);
      white-space: nowrap;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-item i {
      font-size: 19px;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--badge-aktif-bg);
      color: var(--badge-aktif-text);
      font-weight: 600;
    }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--urgent);
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Collapsed Sidebar State */
    .app-shell.sidebar-collapsed .brand-text,
    .app-shell.sidebar-collapsed .nav-label,
    .app-shell.sidebar-collapsed .nav-section-title,
    .app-shell.sidebar-collapsed .nav-dot {
      display: none;
    }

    .app-shell.sidebar-collapsed .sidebar-header {
      justify-content: center;
      padding: 0;
    }

    .app-shell.sidebar-collapsed .brand-mark {
      display: none;
    }

    .app-shell.sidebar-collapsed .nav-item {
      justify-content: center;
      padding: 0;
    }

    /* Main Content Column */
    .app-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .app-topbar {
      height: var(--topbar-height);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0 var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      position: sticky;
      top: 51px;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
    }

    .topbar-title {
      font-size: var(--fs-lg);
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-card-subtle);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      font-size: 18px;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .notif-counter {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--danger);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-pill {
      height: 44px;
      padding: 0 12px 0 6px;
      border-radius: 99px;
      border: 1px solid var(--border-color);
      background: var(--bg-card-subtle);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text-primary);
    }

    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-on);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--fs-xs);
    }

    .page-container {
      padding: var(--space-6);
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* ==========================================================================
       5. ATOMIC COMPONENTS (CARDS, BUTTONS, BADGES, DASH-ROW, METRICS)
       ========================================================================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }

    .card-priority {
      border: 2px solid var(--accent);
      background: linear-gradient(180deg, var(--badge-aktif-bg) 0%, var(--bg-card) 56px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
      flex-wrap: wrap;
    }

    .card-title {
      font-size: var(--fs-lg);
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-subtitle {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      margin: 2px 0 0;
    }

    /* Metric Grid */
    .metric-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-4);
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .metric-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .metric-label {
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-value {
      font-size: var(--fs-xl);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .metric-value.is-urgent {
      color: var(--urgent);
    }

    .metric-foot {
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }

    /* 6 Semantic Badges (UI-GUIDELINES.md) */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      font-size: var(--fs-xs);
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge-aktif {
      background: var(--badge-aktif-bg);
      border-color: var(--badge-aktif-border);
      color: var(--badge-aktif-text);
    }

    .badge-pending {
      background: var(--badge-pending-bg);
      border-color: var(--badge-pending-border);
      color: var(--badge-pending-text);
    }

    .badge-tolak {
      background: var(--badge-tolak-bg);
      border-color: var(--badge-tolak-border);
      color: var(--badge-tolak-text);
    }

    .badge-info {
      background: var(--badge-info-bg);
      border-color: var(--badge-info-border);
      color: var(--badge-info-text);
    }

    .badge-netral {
      background: var(--badge-netral-bg);
      border-color: var(--badge-netral-border);
      color: var(--badge-netral-text);
    }

    .badge-urgent {
      background: var(--urgent);
      border-color: var(--urgent);
      color: var(--urgent-on);
      font-weight: 700;
    }

    /* Buttons (CP.1 Button Hierarchy — 44px Touch Target Floor) */
    .btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: var(--fs-base);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }

    .btn-brand {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-on);
    }

    .btn-brand:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: var(--accent-on);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-outline-brand {
      background: transparent;
      border-color: var(--accent);
      color: var(--badge-aktif-text);
    }

    .btn-danger-outline {
      background: transparent;
      border-color: var(--badge-tolak-border);
      color: var(--badge-tolak-text);
    }

    .btn-danger-outline:hover {
      background: var(--badge-tolak-bg);
    }

    /* Dash-Row List Pattern */
    .dash-list {
      display: flex;
      flex-direction: column;
    }

    .dash-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-color);
    }

    .dash-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .dash-row:first-child {
      padding-top: 0;
    }

    .dash-row-main {
      min-width: 0;
      flex: 1;
    }

    .dash-row-title {
      font-weight: 600;
      font-size: var(--fs-base);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dash-row-meta {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Grid Layouts per Role (Fixing "dash-tiga" monotony!) */
    .grid-2col-asym {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: var(--space-5);
      align-items: start;
    }

    .grid-2col-equal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-5);
      align-items: start;
    }

    /* Stepper / Progress Bar (Fixing Mobile Truncation!) */
    .stepper {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin: var(--space-4) 0;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      position: relative;
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: var(--fs-xs);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border-color);
      background: var(--bg-card-subtle);
      color: var(--text-muted);
      z-index: 2;
    }

    .step-item.done .step-circle {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-on);
    }

    .step-item.current .step-circle {
      border-color: var(--accent);
      color: var(--badge-aktif-text);
      background: var(--badge-aktif-bg);
    }

    .step-label {
      font-size: var(--fs-xs);
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .step-item.current .step-label {
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Segmented Progress Bar (Replaces Broken Donut Charts!) */
    .seg-bar {
      height: 12px;
      border-radius: 99px;
      background: var(--bg-card-subtle);
      overflow: hidden;
      display: flex;
      gap: 2px;
      margin: var(--space-3) 0;
    }

    .seg-fill-aktif { background: var(--accent); }

                <div class="dash-row-main">
                  <div class="dash-row-title">6. Duplikasi 4 Baris Identik di "Admin perlu diingatkan" (Super Admin)</div>
                  <div class="dash-row-meta">Terlihat di: <code>sa-dashboard-desktop.png</code> ("Series Kampus Biru eps 1-2 · Yoga Pratama" muncul 4 kali berturut-turut). Solusi: grup per Proyek + Admin PIC dengan counter jumlah tugas (mis. "4 Honor Belum Ditransfer").</div>
                </div>
                <span class="badge badge-aktif">Fixed</span>
              </div>
              <div class="dash-row">
                <div class="dash-row-main">
                  <div class="dash-row-title">7. Judul Lowongan Terpotong di Landing Mobile ("Iklan ...")</div>
                  <div class="dash-row-meta">Terlihat di: <code>home-mobile.png</code>. Ketika ada 2 badge ("Dibuka" + "Butuh Dadakan"), judul lowongan terhimpit menjadi "Iklan ...". Solusi: letakkan judul di baris penuh atas, dan kelompokkan badge + tanggal deadline di baris kedua.</div>
                </div>
                <span class="badge badge-aktif">Fixed</span>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <h2 class="card-title">6 Kelas Semantik Badge Resmi (WCAG AA ≥ 4.5:1)</h2>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <span class="badge badge-aktif">.badge-aktif (Beres / Lolos / Lunas)</span>
              <span class="badge badge-pending">.badge-pending (Menunggu Tindakan)</span>
              <span class="badge badge-urgent">.badge-urgent (Dadakan / Mendesak)</span>
              <span class="badge badge-tolak">.badge-tolak (Ditolak / Batal / Sengketa)</span>
              <span class="badge badge-info">.badge-info (Diproses Pihak Lain)</span>
              <span class="badge badge-netral">.badge-netral (Info / Role / Hitungan)</span>
            </div>
          </section>
        `;
      }

      function switchRole(roleKey) {
        currentRole = roleKey;
        const cfg = ROLE_CONFIG[roleKey];
        document.getElementById('topbar-title').textContent = cfg.title;
        document.getElementById('topbar-role-badge').textContent = cfg.badge;
        document.getElementById('user-initials').textContent = cfg.initials;
        document.getElementById('user-name').textContent = cfg.name;
        document.getElementById('mob-nav-mid-label').textContent = cfg.midLabel;

        renderSidebar(roleKey);

        const container = document.getElementById('role-view-container');
        if (roleKey === 'super_admin') container.innerHTML = renderSuperAdmin();
        else if (roleKey === 'admin') container.innerHTML = renderAdmin();
        else if (roleKey === 'korlap') container.innerHTML = renderKorlap();
        else if (roleKey === 'client') container.innerHTML = renderClient();
        else if (roleKey === 'extras') container.innerHTML = renderExtras();
        else container.innerHTML = renderTokensAndFixes();

        container.querySelectorAll('[data-toast]').forEach(function (el) {
          el.addEventListener('click', function () {
            showToast(el.getAttribute('data-toast'));
          });
        });
      }

      // Role Pill Listeners
      document.querySelectorAll('.proto-pill[data-role]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.proto-pill[data-role]').forEach(function (b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          switchRole(btn.getAttribute('data-role'));
        });
      });

      // Viewport Toggle (Desktop 1366 vs Mobile 390)
      const stage = document.getElementById('viewport-stage');
      const btnDesktop = document.getElementById('btn-vp-desktop');
      const btnMobile = document.getElementById('btn-vp-mobile');

      btnDesktop.addEventListener('click', function () {
        stage.classList.remove('sim-mobile');
        btnDesktop.classList.add('active');
        btnMobile.classList.remove('active');
        showToast('Mode layar: Desktop (1366px)');
      });

      btnMobile.addEventListener('click', function () {
        stage.classList.add('sim-mobile');
        btnMobile.classList.add('active');
        btnDesktop.classList.remove('active');
        showToast('Mode layar: Simulasi HP (390px)');
      });

      // Theme Toggle
      function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('jbtb_theme', next); } catch (e) {}
        showToast('Tema diubah ke mode ' + (next === 'dark' ? 'Gelap' : 'Terang'));
      }

      document.getElementById('btn-proto-theme').addEventListener('click', toggleTheme);
      document.getElementById('btn-topbar-theme').addEventListener('click', toggleTheme);

      // Sidebar Collapse Toggle (Demonstrating the fix for the vertical text bug!)
      document.getElementById('btn-collapse-sidebar').addEventListener('click', function () {
        const shell = document.getElementById('app-shell');
        shell.classList.toggle('sidebar-collapsed');
        const isCollapsed = shell.classList.contains('sidebar-collapsed');
        showToast(isCollapsed ? 'Sidebar dilipat (tanpa teks patah!)' : 'Sidebar dibuka penuh');
      });

      // Notification Bell
      document.getElementById('btn-notif').addEventListener('click', function () {
        const c = document.getElementById('notif-count');
        c.textContent = '0';
        c.style.display = 'none';
        showToast('Semua notifikasi ditandai sudah dibaca');
      });

      // Mobile Bottom Nav
      document.querySelectorAll('.mobile-nav-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.mobile-nav-btn').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          showToast('Navigasi mobile: ' + btn.textContent.trim());
        });
      });

      // Initial render
      switchRole('super_admin');
    })();
  </script>
</body>
</html>
